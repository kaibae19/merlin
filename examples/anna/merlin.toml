# Layout for an Anna record (the record template of the Anna scaffold). Copy it, or point MERLIN_TOML in
# deploy/.env at it. Same ranking as the shipped default; the paths and types follow Anna's folders.
exclude = ["**/_template.md"]
dated_filename_types = ["journal"] # a YYYY-MM-DD in the filename is the doc date (day files and handoffs)
history_types = ["journal", "host"]
canonical = ["host", "runbook", "context"]

layers = [                         # first match wins; only *.md files are ever indexed
  { glob = "journal/README.md",    type = "doc" },
  { glob = "journal/**",           type = "journal" },     # day files, plus journal/handoffs/ (the headless runs' reports)
  { glob = "hosts/README.md",      type = "doc" },
  { glob = "hosts/*.md",           type = "host" },
  { glob = "runbooks/README.md",   type = "doc" },
  { glob = "runbooks/**",          type = "runbook" },
  { glob = "memory/MEMORY.md",     type = "memory-index" },
  { glob = "memory/README.md",     type = "doc" },
  { glob = "memory/*.md",          type = "memory" },
  { glob = "planning/**",          type = "planning" },
  { glob = "bot/context/README.md", type = "doc" },
  { glob = "bot/context/**",       type = "context" },     # what the bot knows without looking it up
  { glob = "**/*.md",              type = "doc" },         # CLAUDE.md, clock/, checks/, senses/ READMEs
]

[entities]
name = "host"                      # keeps host_history, which Anna's engines call
types = ["host"]
key = "host"                       # each hosts/<name>.md needs front matter `host: <name>` (see README.md)
alias_fields = ["aliases", "ips"]

[weights]
journal = "what was seen on that date: verbatim evidence, may be superseded by later entries"
host = "current practice: what each host or device is and how it is set up now"
runbook = "current practice: how to do it"
memory = "lessons and gotchas, short, with pointers to the detail"
memory-index = "the index of lessons"
planning = "intent: what is planned, not what is done"
context = "current: names, rooms, devices the person's assistant should know without looking up"
doc = "orientation and conventions"

[boost]
host = 1.3
runbook = 1.3
memory = 1.3
context = 1.2
journal = 1.0
planning = 0.9
doc = 0.8
memory-index = 0.6

[recency]
weight = 0.05
half_life_days = 30

[stale]
heading = '(?i)\b(superseded|obsolete)\b'
lead = '(?i)^\W*(superseded|obsolete)\b'
factor = 0.5
inherit = ["journal"]              # a day index above a superseded section is stale too

[history]
record_chunks = 1                  # host_history leads with the host's own record
exclude = ["journal/handoffs/**"]  # the daily reports restate other docs
