# merlin, all in one: Postgres + pgvector, a CPU embedder (TEI) and merlin itself, on one machine.
# Quick start: README.md § Quick start. Copy .env.example to .env first.
name: merlin

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: merlin
      POSTGRES_DB: merlin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - merlin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merlin -d merlin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    # The batch limits keep TEI's memory bounded on small machines (without them it can OOM on a long document).
    command: ["--model-id", "nomic-ai/nomic-embed-text-v1.5", "--max-batch-tokens", "2048", "--max-client-batch-size", "32"]
    mem_limit: 3g
    volumes:
      - merlin_tei:/data              # the model download (~550 MB), kept across restarts

  app:
    build: ..                         # this repo
    image: merlin:local
    profiles: [tools]                 # runs on demand only: `docker compose run --rm app ...`
    environment:
      DATABASE_URL: postgresql://merlin@db:5432/merlin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      EMBED_URL: http://embed:80
      REPO_DIR: /repo
      MERLIN_CONFIG: /config/merlin.toml
      TZ: ${TZ:-UTC}
    volumes:
      - ${RECORD_DIR:?set RECORD_DIR in .env}:/repo:ro
      - ${MERLIN_TOML:-../merlin.example.toml}:/config/merlin.toml:ro
    depends_on:
      db: {condition: service_healthy}
      embed: {condition: service_started}

volumes:
  merlin_pg:
  merlin_tei:
